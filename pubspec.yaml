name: trainerpro
description: Aplicación de entrenamiento personal
publish_to: 'none' # No publicar en pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI y diseño
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Estado y persistencia
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Navegación
  go_router: ^13.0.1
  
  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  
  # Animaciones
  flutter_animate: ^4.1.1+1
  
  # Gráficos
  fl_chart: ^0.66.0

  # Nuevas dependencias
  confetti: ^0.7.0
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  flutter_lucide: ^1.33.0
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  